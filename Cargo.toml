[workspace]
resolver = "3"
members = [
  "apps/desktop-tauri/src-tauri",
  "crates/telaion-config",
  "crates/telaion-core",
]

default-members = ["apps/desktop-tauri/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
telaion-config = { path = "crates/telaion-config" }
telaion-core = { path = "crates/telaion-core" }
directories = "6"

#= Tomet
tomet-ast = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-parser = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-printer = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-workspace = { git = "https://github.com/tomet-lang/tomet.git" }

#= Tauri v3
tauri = { version = "3.0.0-alpha.5", features = [] }
tauri-build = { version = "3.0.0-alpha.4", features = [] }
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-runtime-wry = "3.0.0-alpha.5"

#= Serialization & Async
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3

[patch."https://github.com/tomet-lang/tomet.git"]
tomet-ast = { path = "../tomet/crates/tomet-syntax-ast" }
tomet-parser = { path = "../tomet/crates/tomet-syntax-parser" }
tomet-printer = { path = "../tomet/crates/tomet-format-printer" }
tomet-workspace = { path = "../tomet/crates/tomet-workspace" }
